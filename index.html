<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand-mark.svg" />
    <title>Agents Dashboard</title>
    <style>
      /* 首屏底色与 cds-tokens.css 的 surface-1 保持一致，避免主题闪色 */
      html {
        background: #fcfcfb;
      }
      html.dark {
        background: #151515;
      }
    </style>
    <script>
      (function () {
        try {
          var m = localStorage.getItem("theme");
          if (m !== "dark" && m !== "light") m = "auto";
          var dark =
            m === "dark" ||
            (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
